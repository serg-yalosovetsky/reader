# ВНИМАНИЕ: это КОПИЯ боевого /etc/nginx/sites-available/reader.ibotz.fun.
# Сведена с боем 2026-08-27 (serg/tasks#110). Единственное намеренное
# расхождение — значение X-Internal-Secret: здесь плейсхолдер
# <VPS_SSO_INTERNAL_SECRET>, в бою реальный секрет. Всё остальное обязано
# совпадать дословно: по этому файлу читалку поднимут заново, и если в нём
# не будет location /api/ с @sso_json, вернётся баг v6 update-pipeline —
# кросс-ориджин 302 на SSO превращает протухшую сессию в «Failed to fetch».
# Сверка: diff <(sed 's/<VPS_SSO_INTERNAL_SECRET>/.../' этот-файл) боевой
#
# СЕКРЕТ В ИСТОРИИ, И ЭТО НЕ ИСПРАВЛЯЕТСЯ УДАЛЕНИЕМ ИЗ ФАЙЛА.
# Плейсхолдер убрал значение из рабочего дерева, но оно осталось в коммите
# 2e28a57 и доступно анонимно: репозиторий на GitHub публичный, raw-выдача по
# старому SHA отдаёт файл целиком. Значение ЖИВОЕ — то же самое, что сейчас
# проверяет vps-sso. Пока оно не ротировано, считать его скомпрометированным.
# Ротация: сменить в шлюзе (VPS_SSO_INTERNAL_SECRET), перегенерировать
# snippets/vps-sso-auth*.conf, обновить проверяющую сторону vps-sso, reload
# nginx — и только потом решать, чистить ли историю (удаление новым коммитом
# её НЕ чистит).

# nginx-сайт читалки: HTTPS + vps-sso (паттерн как у monoflow.ibotz.fun).
# Кладётся в /etc/nginx/sites-available/reader.ibotz.fun и симлинкуется в sites-enabled.
# Сертификат выдаёт certbot: certbot certonly --nginx -d reader.ibotz.fun
# Бэкенд читалки слушает 127.0.0.1:8123 (см. reader.service).

# Дополнительный путь входа для мобильного приложения: reader-only токен в
# заголовке X-Reader-Token. Браузеры этот заголовок не шлют и проходят через
# vps-sso ниже без изменений — это аддитив, веб-логин по SSO нетронут. Значение
# токена лежит в server-only сниппете (НЕ в git), который определяет map
# $http_x_reader_token -> $reader_token_ok. Образец: deploy/reader-token-map.conf.example
include /etc/nginx/snippets/reader-token-map.conf;

server {
    server_name reader.ibotz.fun;
    http2 on;

    # ---- сжатие ----
    # В nginx.conf gzip on, но gzip_types/gzip_proxied закомментированы, поэтому
    # по умолчанию жмётся только text/html и только не проксированное — то есть
    # ничего из того, что отдаёт читалка. Список библиотеки это ~960 КБ JSON на
    # каждое открытие, плюс несжатые js/css фронта.
    # epub/обложек тут нет намеренно: они уже сжаты, гонять их через gzip — только
    # греть процессор.
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css
               image/svg+xml application/xml text/plain;

    # ---- vps-sso auth_request (internal only) ----
    location = /sso-auth {
        internal;
        # Мобильное приложение предъявило валидный reader-only токен → авторизуем
        # сразу, не дёргая vps-sso. ('if' с одним 'return' — безопасный случай.)
        if ($reader_token_ok) { return 200; }
        proxy_pass http://[::1]:3010/api/auth/check;
        # Clerk отдаёт 307 на browser-like запросы — auth_request такое не умеет,
        # поэтому исходные заголовки браузера не пробрасываем.
        proxy_pass_request_headers off;
        proxy_set_header Host              sso.ibotz.fun;
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
        # machine clients: forward Bearer svc-token to /api/auth/check (opaque-token path)
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Accept            "application/json";
        proxy_set_header User-Agent        "nginx-auth-subrequest";
        # ЗНАЧЕНИЕ НЕ В GIT: общий секрет vps-sso, лежит только в боевом конфиге
        # на сервере. При развёртывании подставить из secrets-gateway.
        proxy_set_header X-Internal-Secret <VPS_SSO_INTERNAL_SECRET>;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # ---- всё за SSO ----
    location / {
        auth_request /sso-auth;
        auth_request_set $sso_email $upstream_http_x_auth_email;
        auth_request_set $sso_user  $upstream_http_x_auth_user;

        error_page 401 403 = @sso_redirect;

        proxy_pass http://127.0.0.1:8123;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Email $sso_email;
        proxy_set_header X-Forwarded-User  $sso_email;
        proxy_set_header Remote-User       $sso_email;
    }

    # ---- API: тот же SSO, но отказ отдаём JSON-ом, а не редиректом ----
    # Раньше /api/* попадал в location / и на протухшей сессии получал
    # `error_page 401 → 302 на sso.ibotz.fun`. Для браузера это КРОСС-ОРИДЖИН
    # редирект: fetch('/api/...', {method:'POST', headers:{'Content-Type':
    # 'application/json'}}) — не simple-запрос, редирект на чужой origin ему
    # запрещён, и промис падает с `TypeError: Failed to fetch` без статуса и
    # без тела. Именно это видел пользователь, нажимая «Обновления»: GET-ы
    # рисовали библиотеку из кэша service worker'а, так что сайт выглядел
    # живым, а любое действие молча умирало.
    # Теперь /api/* отдаёт честный 401 с телом — фронт (js/core/api.js) его
    # распознаёт и зовёт перелогин.
    location /api/ {
        auth_request /sso-auth;
        auth_request_set $sso_email $upstream_http_x_auth_email;
        auth_request_set $sso_user  $upstream_http_x_auth_user;

        error_page 401 403 = @sso_json;

        proxy_pass http://127.0.0.1:8123;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Email $sso_email;
        proxy_set_header X-Forwarded-User  $sso_email;
        proxy_set_header Remote-User       $sso_email;

        # Проверка одной книги (POST /api/monitored/check/<id>) скачивает её
        # синхронно с внешнего сайта — дефолтные 60s давали 504 на длинных
        # фиках. Общая проверка всех подписок и так фоновая (check_job).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location @sso_redirect {
        return 302 https://sso.ibotz.fun/sign-in?redirect_url=$scheme://$host$request_uri;
    }

    # Машиночитаемый отказ для /api/*: статус, который fetch реально получит.
    location @sso_json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 '{"error":"sso_required","login_url":"https://sso.ibotz.fun/sign-in?redirect_url=https://reader.ibotz.fun/"}';
    }

    client_max_body_size 1000M;
    access_log /var/log/nginx/reader.access.log;
    error_log  /var/log/nginx/reader.error.log;

    listen 443 ssl;
    listen [::]:443 ssl;  # IPv6
    ssl_certificate /etc/letsencrypt/live/reader.ibotz.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reader.ibotz.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ---- HTTP -> HTTPS ----
server {
    if ($host = reader.ibotz.fun) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name reader.ibotz.fun;
    return 404;
}
