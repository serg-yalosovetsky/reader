# Раскатка reader. Агент пушит в main — дальше всё само.
#
# Гейт идёт на ОБЛАЧНОМ раннере GitHub, а job раскатки — на self-hosted раннере
# на VPS. Причина ровно одна и проверяемая: приёмник meshdeploy слушает только
# tailnet, и облачный раннер до него не достаёт. Наружу дверь деплоя при этом
# не открывается.
#
# Права раскатывать у CI нет и здесь: он отправляет ПОДПИСАННЫЙ запрос, а
# раскатку, проверку и откат делает узел (serg/meshdeploy).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: ревизия для раскатки
        required: false

env:
  SERVICE: reader
  RECEIVER: http://100.66.108.118:9001/hooks/deploy

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Компиляция (блокирующая)
        # Гейт намеренно скромный, но НАСТОЯЩИЙ: синтаксически сломанный код
        # дальше не проходит. Линтеры в режиме annotate-only гейтом быть не
        # могут — они заканчиваются `|| true`, и зелёный прогон там ничего
        # не обещает.
        run: python -m compileall -q .

      - name: "Shell-скрипты — без CRLF и синтаксически целые"
        # Возврат каретки ломает запуск скрипта молча, и в codehealth это было
        # невидимо двое суток. Проверка стоит здесь, потому что позже её уже
        # некому делать: узел выполнит то, что приедет.
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh' '*.bash')
          if [ ${#scripts[@]} -eq 0 ]; then echo "shell-скриптов нет"; exit 0; fi
          for f in "${scripts[@]}"; do
            if file "$f" | grep -q CRLF; then
              echo "ОТКАЗ: $f с CRLF — на узле он не запустится" >&2
              exit 1
            fi
            bash -n "$f"
          done

  deploy:
    needs: gate
    # Метка mesh-vps — это раннер на VPS, поднятый специально для этого
    # репозитория. Раннер уровня организации на личном аккаунте невозможен,
    # поэтому у каждого сервиса он свой.
    runs-on: [self-hosted, mesh-vps]
    steps:
      - name: Запросить раскатку у узла
        env:
          SECRET: ${{ secrets.MESHDEPLOY_HOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SECRET" || { echo "ОТКАЗ: не задан секрет MESHDEPLOY_HOOK_SECRET" >&2; exit 1; }

          REF="${{ inputs.ref || github.sha }}"
          BODY=$(printf '{"service":"%s","ref":"%s","trigger":"github"}' "$SERVICE" "$REF")
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $NF}')

          # Приёмник отвечает 409, если на узле УЖЕ идёт раскатка: он отказывает,
          # а не встаёт в очередь — и это правильно для узла. А вот для CI 409 — это
          # ВРЕМЕННОЕ состояние, а не ошибка пуша: без повтора одновременные пуши
          # в два разных репозитория дают красный прогон на исправном сервисе
          # (поймано 22.09.2026: mesh-broker и hermes-voice так и не раскатались).
          #
          # --fail-with-body: ненулевой код при HTTP 5xx И печать тела ответа.
          # В теле приходит весь отчёт раскатки — он и есть строка доказательства.
          # Приёмник отвечает 403 на неверную подпись (а не 200), поэтому
          # испорченный секрет тоже красит прогон, а не притворяется успехом.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/deploy-out.txt -w '%{http_code}' -m 900 -X POST \
              -H 'Content-Type: application/json' \
              -H "X-Mesh-Signature: sha256=$SIG" \
              -d "$BODY" \
              "$RECEIVER") || true
            cat /tmp/deploy-out.txt
            if [ "$code" = "409" ]; then
              echo "узел занят другой раскаткой (попытка $attempt), жду 30 с"
              sleep 30
              continue
            fi
            [ "$code" = "200" ] && exit 0
            echo "приёмник ответил $code" >&2
            exit 1
          done
          echo "узел оставался занят все попытки — раскатки не было" >&2
          exit 1

  mirror-forgejo:
    # Копия кода в Forgejo serg/reader (serg/tasks#1549). Источник правды — этот
    # репозиторий на GitHub; Forgejo читают приёмщики, MCP tasks/forgejo и
    # /opt/reader на узле — без зеркала они видят историю недельной давности.
    #
    # Копия только для ЧТЕНИЯ людьми и агентами: ничто в меше из неё не
    # раскатывается и ей не доверяет. meshdeploy берёт код из origin дерева
    # /opt/reader, а origin — этот GitHub-репозиторий; Actions в Forgejo для
    # serg/reader выключены (has_actions=false), webhook'ов там нет. Поэтому
    # запись в копию по deploy key не даёт пути к проду.
    #
    # needs: deploy — зеркалим то, что РЕАЛЬНО раскатано. Упала раскатка —
    # Forgejo не трогаем: копия не должна обгонять прод. Это осознанно.
    # Только push: ручной запуск с произвольным ref раскатывает не обязательно
    # голову main, и тащить такую ревизию в main копии нельзя.
    needs: deploy
    if: github.event_name == 'push'
    # Тот же раннер, что у раскатки: он в меше и видит forgejo.ibotz.fun:2222.
    # Облачный раннер Forgejo по SSH может и не увидеть, а проверять это на
    # каждом пуше — значит получить флак вместо зеркала.
    runs-on: [self-hosted, mesh-vps]
    env:
      # Host key встроенного SSH-сервера Forgejo (RSA, порт 2222), снят
      # ssh-keyscan с узла и сверен с 127.0.0.1:2222 на самом Forgejo:
      # SHA256:MaPhkHmgoLB4q+lBCgJaZjnWjeac8uNyvkoK+3QrM/c.
      # Зафиксирован здесь, а не принимается на лету: StrictHostKeyChecking=no
      # отдал бы deploy key любому, кто встанет посередине. Сменился ключ
      # Forgejo — job красный, и это правильно: обновить строку руками.
      FORGEJO_HOSTKEY: "[forgejo.ibotz.fun]:2222 ssh-rsa "
      FORGEJO_URL: ssh://git@forgejo.ibotz.fun:2222/serg/reader.git
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: иначе push мелкого клона упирается в «shallow
          # update not allowed», и это выглядит как отказ Forgejo.
          fetch-depth: 0

      - name: Пуш в Forgejo — только fast-forward
        env:
          # Deploy key на ОДИН репозиторий serg/reader, а не общий токен
          # Forgejo: утечка секрета отсюда даёт запись в копию reader и больше
          # никуда. Значение GitHub маскирует в логе; в файл — только 0600.
          DEPLOY_KEY: ${{ secrets.FORGEJO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo "ОТКАЗ: не задан секрет FORGEJO_DEPLOY_KEY" >&2; exit 1; }

          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/forgejo_key"
          printf '%s\n' "$FORGEJO_HOSTKEY" > "$RUNNER_TEMP/forgejo_known_hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/forgejo_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/forgejo_known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes"

          git remote remove forgejo 2>/dev/null || true
          git remote add forgejo "$FORGEJO_URL"

          # БЕЗ --force и без --force-with-lease. Если в Forgejo появился коммит,
          # которого нет здесь (кто-то закоммитил в копию), push получит
          # non-fast-forward и job покраснеет. Перезаписать чужую историю молча
          # хуже, чем один красный прогон: его видно, и разбирается он руками.
          git push forgejo "HEAD:refs/heads/main"

          remote_sha=$(git ls-remote forgejo refs/heads/main | cut -f1)
          echo "GitHub ${GITHUB_SHA} -> Forgejo main ${remote_sha}"
          # Код 0 у push — намерение, а не результат: read-back того, куда
          # теперь указывает main в Forgejo.
          [ "$remote_sha" = "$GITHUB_SHA" ] || { echo "ОТКАЗ: Forgejo main != $GITHUB_SHA" >&2; exit 1; }

      - name: Убрать ключ с раннера
        # always(): ключ не должен пережить job, даже упавший. Раннер
        # постоянный, следующий job на нём — чужой репозиторий.
        if: always()
        run: rm -f "$RUNNER_TEMP/forgejo_key" "$RUNNER_TEMP/forgejo_known_hosts"
