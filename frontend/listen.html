<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слушать статью — Reader</title>
<style>
:root{--bg:#12161d;--panel:#1a212b;--bd:#2a333f;--ink:#e6e9ee;--muted:#8b95a3;
  --accent:#48b2d4;--gold:#e2ac47;--hl:#2c3a2a;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65}
.bar{position:sticky;top:0;z-index:5;background:rgba(18,22,29,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar button,.bar select{font-family:var(--mono);font-size:13px;background:var(--panel);
  color:var(--ink);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer}
.bar button:hover{border-color:var(--accent)}
#play{background:var(--accent);color:#04222c;border-color:var(--accent);font-weight:600;min-width:96px}
.bar .sp{flex:1}
a.src{font-family:var(--mono);font-size:12px;color:var(--muted)}
main{max-width:720px;margin:0 auto;padding:26px 20px 120px}
h1{font-size:26px;line-height:1.25;text-wrap:balance;margin:0 0 6px}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:22px}
#art p{margin:0 0 16px;font-size:17px}
#art p.on{background:var(--hl);border-radius:6px;box-shadow:0 0 0 8px var(--hl)}
.status{font-family:var(--mono);font-size:13px;color:var(--muted);padding:40px 0}
.err{color:var(--gold)}
</style>
</head>
<body>
<div class="bar">
  <button id="play">▶ Слушать</button>
  <button id="prev" title="предыдущий абзац">⏮</button>
  <button id="next" title="следующий абзац">⏭</button>
  <select id="voice" title="голос"></select>
  <select id="rate" title="скорость">
    <option value="-15%">0.85×</option><option value="+0%" selected>1×</option>
    <option value="+15%">1.15×</option><option value="+30%">1.3×</option><option value="+50%">1.5×</option>
  </select>
  <span class="sp"></span>
  <a class="src" id="src" target="_blank" rel="noopener">источник ↗</a>
</div>
<main>
  <h1 id="title">Загрузка…</h1>
  <div class="meta" id="metaline"></div>
  <div id="art"></div>
  <div class="status" id="status"></div>
</main>
<audio id="au"></audio>
<script>
const qs=new URLSearchParams(location.search);
const URL_=qs.get("url")||qs.get("article");
const au=document.getElementById("au");
let chunks=[], idx=0, playing=false, prefetch={};

function splitText(text){
  const paras=text.split(/\n{2,}/).map(s=>s.trim()).filter(Boolean);
  const out=[]; const MAX=1400;
  for(const p of paras){
    if(p.length<=MAX){out.push(p);continue;}
    let buf="";
    for(const sent of p.split(/(?<=[.!?…])\s+/)){
      if((buf+" "+sent).length>MAX){if(buf)out.push(buf);buf=sent;}
      else buf=(buf?buf+" ":"")+sent;
    }
    if(buf)out.push(buf);
  }
  return out;
}
function detectVoice(text){
  const cyr=(text.match(/[а-яёіїєґ]/gi)||[]).length;
  const lat=(text.match(/[a-z]/gi)||[]).length;
  return cyr*2>=lat ? "xenia" : "jenny";  // favour RU when substantial Cyrillic (code adds Latin noise)
}
async function loadVoices(pref){
  try{
    const v=await (await fetch("/api/tts/voices")).json();
    const sel=document.getElementById("voice");
    const list=v.voices||v.items||v;
    (Array.isArray(list)?list:[]).forEach(o=>{
      const id=o.id||o.voice||o; const name=o.name||o.title||id;
      const opt=document.createElement("option");opt.value=id;opt.textContent=name;sel.appendChild(opt);
    });
    if([...sel.options].some(o=>o.value===pref)) sel.value=pref;
  }catch(e){}
}
async function synth(i){
  const t=chunks[i]; if(!t)return null;
  if(prefetch[i])return prefetch[i];
  const voice=document.getElementById("voice").value;
  const rate=document.getElementById("rate").value;
  const pr=fetch("/api/tts/synth",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text:t,voice,rate})}).then(r=>r.ok?r.json():Promise.reject(r.status));
  prefetch[i]=pr; return pr;
}
function markOn(i){
  document.querySelectorAll("#art p").forEach((p,k)=>p.classList.toggle("on",k===i));
  const el=document.querySelectorAll("#art p")[i];
  if(el)el.scrollIntoView({behavior:"smooth",block:"center"});
}
async function playFrom(i){
  if(i>=chunks.length){stop();return;}
  idx=i; markOn(i);
  document.getElementById("status").textContent="Синтез…";
  try{
    const {audio_url}=await synth(i);
    au.src=audio_url; await au.play();
    document.getElementById("status").textContent="";
    synth(i+1); // prefetch next
  }catch(e){
    document.getElementById("status").innerHTML='<span class="err">Ошибка синтеза абзаца '+(i+1)+'</span>';
    setTimeout(()=>{if(playing)playFrom(i+1);},600);
  }
}
au.addEventListener("ended",()=>{if(playing)playFrom(idx+1);});
function setPlay(on){playing=on;document.getElementById("play").textContent=on?"⏸ Пауза":"▶ Слушать";}
function stop(){setPlay(false);au.pause();}
document.getElementById("play").onclick=()=>{
  if(playing){stop();}else{setPlay(true);if(au.src&&au.currentTime>0&&!au.ended){au.play();}else{playFrom(idx);}}
};
document.getElementById("prev").onclick=()=>{if(chunks.length){idx=Math.max(0,idx-1);if(playing)playFrom(idx);else markOn(idx);}};
document.getElementById("next").onclick=()=>{if(chunks.length){idx=Math.min(chunks.length-1,idx+1);if(playing)playFrom(idx);else markOn(idx);}};
document.getElementById("voice").onchange=()=>{prefetch={};if(playing)playFrom(idx);};
document.getElementById("rate").onchange=()=>{prefetch={};if(playing)playFrom(idx);};

async function init(){
  if(!URL_){document.getElementById("title").textContent="Нет параметра ?url=";return;}
  document.getElementById("src").href=URL_;
  try{
    const a=await (await fetch("/api/article?url="+encodeURIComponent(URL_))).json();
    if(a.detail){throw new Error(a.detail);}
    document.getElementById("title").textContent=a.title||URL_;
    document.title=(a.title||"Статья")+" — Слушать";
    let host=""; try{host=new URL(a.final_url||URL_).hostname;}catch(e){}
    document.getElementById("metaline").textContent=host+" · "+(a.chars||0).toLocaleString("ru")+" симв.";
    chunks=splitText(a.text||"");
    const art=document.getElementById("art");
    art.innerHTML=chunks.map(c=>{const p=document.createElement("p");p.textContent=c;return p.outerHTML;}).join("");
    await loadVoices(detectVoice(a.text||""));
    document.getElementById("status").textContent=chunks.length+" абзацев готово — нажми «Слушать»";
  }catch(e){
    document.getElementById("title").textContent="Не удалось загрузить статью";
    document.getElementById("status").innerHTML='<span class="err">'+(e.message||e)+'</span> — <a class="src" href="'+URL_+'" target="_blank">открыть оригинал ↗</a>';
  }
}
init();
</script>
</body>
</html>
